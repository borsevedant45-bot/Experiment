      <line x1="20" y1="42" x2="80" y2="42" stroke="#1E1D1A" stroke-width="4"/>
      <circle cx="66" cy="49" r="8" fill="#E8B83A" stroke="#1E1D1A" stroke-width="3"/>
    </symbol>
    <symbol id="bag" viewBox="0 24 100 66">
