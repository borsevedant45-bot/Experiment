      <ellipse cx="36" cy="62" rx="13" ry="7" fill="#2F6B4F" stroke="#1E1D1A" stroke-width="3" transform="rotate(-30 36 62)"/>
      <ellipse cx="64" cy="62" rx="13" ry="7" fill="#2F6B4F" stroke="#1E1D1A" stroke-width="3" transform="rotate(30 64 62)"/>
      <ellipse cx="36" cy="40" rx="12" ry="6.5" fill="#2F6B4F" stroke="#1E1D1A" stroke-width="3" transform="rotate(-30 36 40)"/>
      <ellipse cx="64" cy="40" rx="12" ry="6.5" fill="#2F6B4F" stroke="#1E1D1A" stroke-width="3" transform="rotate(30 64 40)"/>
