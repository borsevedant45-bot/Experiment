<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Living Kitchen — asset symbol library (16_ASSET_DIRECTION).
       Flat 2D vector, charcoal outlines, opaque palette fills.
       Stable silhouettes (08 rule 1). Reference via <use href="assets/kitchen.svg#id">.
       Animated choreography stays inline; these symbols are the reusable cast. -->
  <defs>
    <!-- plates / bowls / trays (P0) -->
    <symbol id="plate" viewBox="0 30 100 52">
      <ellipse cx="50" cy="56" rx="44" ry="20" fill="#FFFDF7" stroke="#1E1D1A" stroke-width="4"/>
      <ellipse cx="50" cy="54" rx="30" ry="12" fill="none" stroke="#1E1D1A" stroke-width="2.5" opacity="0.45"/>
    </symbol>
    <symbol id="tray" viewBox="0 50 100 40">
      <rect x="8" y="58" width="84" height="24" rx="7" fill="#E8B83A" stroke="#1E1D1A" stroke-width="4"/>
      <rect x="20" y="66" width="34" height="6" rx="3" fill="#1E1D1A" opacity="0.18"/>
    </symbol>
    <symbol id="bowl" viewBox="0 35 100 55">
      <path d="M12 50 h76 c0 22 -16 34 -38 34 s-38 -12 -38 -34 Z" fill="#2F6B4F" stroke="#1E1D1A" stroke-width="4" stroke-linejoin="round"/>
